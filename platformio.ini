; Maßarbeit Waage - eine Codebasis, zwei Geraetevarianten.
;
; Board-Referenzen:
;   gross: https://github.com/Xinyuan-LilyGO/T-Display-S3
;   Light: https://github.com/Xinyuan-LilyGO/LilyGo-T-OI-PLUS  (T-OI Plus
;          V1.3, Aufdruck "mini D1 PLUS", ESP32-C3)
; Kalibrier-/BLE-/HX711-Muster-Referenz: https://github.com/031devstudios/weighmybru2
;
; Environments:
;   t-display-s3         - grosse Waage mit TFT, Flashen ueber USB-C (esptool)
;   t-display-s3-ota     - dieselbe Firmware, Upload ueber WLAN (ArduinoOTA),
;                          nur fuer die Entwicklungsphase. IP-Adresse des
;                          Boards nach dem Booten im Serial-Log bzw. auf dem
;                          TFT ablesen:
;                            pio run -e t-display-s3-ota -t upload --upload-port <IP>
;                          OTA ist nur aktiv, wenn beim Booten Taste 2
;                          gehalten wird (siehe src/DevOta.cpp) - spart im
;                          Party-Betrieb Akku, da WLAN sonst komplett aus
;                          bleibt.
;   massarbeit-light-c3  - "Waage Light" ohne Display, Flashen ueber USB
;
; Der S3 ist ein Xtensa-Kern, der C3 der Light ein RISC-V - eine einzelne
; .bin kann gar nicht auf beiden starten. Geteilt wird deshalb der Quelltext,
; nicht das Binary; welche Variante gebaut wird, entscheidet allein das
; -DMASSARBEIT_VARIANT_*-Flag (siehe include/BoardConfig.h).

[env]
platform  = espressif32@6.5.0
framework = arduino

build_flags =
    -DDISABLE_ALL_LIBRARY_WARNINGS

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    robtillaart/HX711@^0.6.0
    h2zero/NimBLE-Arduino@^1.4.1
    mathertel/OneButton@^2.6.1

; ============================================================================
; Grosse Waage: LilyGO T-Display S3
; ============================================================================
[env:t-display-s3]
board = lilygo-t-display-s3

; SPIFFS statt der einzeln kompilierten C-Arrays fuer die Sprite-Boot-
; animation (data/*.raw, siehe TftDisplay::playBootSprite()) - 50
; indizierte 320x170-Frames waeren als C-Quelltext mehrere MB Text und
; wuerden die Kompilierzeit unnoetig aufblaehen. Board-Partitionstabelle
; bringt bereits eine 3,5MB-spiffs-Partition mit (siehe Board-Profil).
; Upload separat noetig: `pio run -t uploadfs --upload-port <PORT>`.
board_build.filesystem = spiffs

; Der T-Display S3 nutzt den nativen USB-Port des ESP32-S3 als Serial/CDC.
; Ohne diese beiden Flags bleibt der Serial Monitor stumm.
build_flags =
    ${env.build_flags}
    -DMASSARBEIT_VARIANT_PRO
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; PlatformIO kompiliert sonst alles in src/ - die LED-Anzeige der Light
; braucht die grosse Waage nicht (und umgekehrt).
build_src_filter = +<*> -<LedStatusUi.cpp>

lib_deps =
    ${env.lib_deps}
    ; Exakt auf die Version gepinnt, die LilyGO selbst im T-Display-S3-Repo
    ; mitliefert und gegen genau dieses platform/core-Paar (espressif32@6.5.0,
    ; arduino-esp32 2.0.14) baut. Neuere Versionen brauchen entweder
    ; esp32-hal-periman.h (ab v1.6.2, existiert erst in neueren Cores) oder
    ; stolpern beim Kompilieren von Arduino_ESP32RGBPanel.cpp ueber ein IDF-
    ; Struct, das sich zwischenzeitlich geaendert hat (ungenutzter Codepfad,
    ; wir brauchen nur Arduino_ESP32PAR8Q).
    moononournation/GFX Library for Arduino@1.4.2

upload_protocol = esptool

[env:t-display-s3-ota]
extends = env:t-display-s3
upload_protocol = espota
; upload_port wird beim Aufruf per --upload-port <IP> mitgegeben, sobald
; das Board im OTA-Modus im WLAN ist (siehe Header-Kommentar oben).
; Das OTA-Passwort steht in include/Config.h (OTA_PASSWORD) - beim Upload
; zusaetzlich anhaengen: --upload-flags="--auth=<dasselbe Passwort>"

; ============================================================================
; Waage Light: LilyGO T-OI Plus V1.3 ("mini D1 PLUS", ESP32-C3), ohne Display
; ============================================================================
[env:massarbeit-light-c3]
board = ttgo-t-oi-plus

; Serial laeuft ueber den CH340 an UART0 - das Board hat KEINEN nativen
; USB-Anschluss am Chip, deshalb hier auch keine CDC-Flags wie beim S3.

build_flags =
    ${env.build_flags}
    -DMASSARBEIT_VARIANT_LIGHT

; Kein TFT-Code im Light-Binary: TftDisplay.cpp braucht Arduino_GFX, das in
; diesem Environment gar nicht erst als Abhaengigkeit auftaucht.
build_src_filter = +<*> -<TftDisplay.cpp>

; Die Standard-Partitionstabelle des 4MB-Boards gibt jedem OTA-Slot nur 1,25MB
; und reserviert 1,5MB fuer ein SPIFFS, das die Light gar nicht braucht (keine
; Boot-Sprites). min_spiffs.csv dreht das Verhaeltnis um: ~1,9MB je OTA-Slot,
; also reichlich Luft fuer kuenftige Firmware - und Updates per BLE bleiben
; moeglich, weil es weiterhin zwei App-Partitionen gibt.
board_build.partitions = min_spiffs.csv

upload_protocol = esptool
