<svg viewBox="0 0 640 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pinbelegung der Maßarbeit Vision (LilyGO T-Display S3): GPIO1/2 HX711, GPIO0/14 Taster, GPIO4 Batterie-ADC, GPIO15 Peripherie-Power-Enable, GPIO5-9 und GPIO38-48 LCD-Bus.">
  <title>Pinbelegung Maßarbeit Vision (LilyGO T-Display S3)</title>
  <desc>GPIO-Zuordnung des ESP32-S3-Boards: Wägezelle an GPIO1/2, zwei Taster an GPIO0/14, Batterie-ADC an GPIO4, Peripherie-Power-Enable an GPIO15, TFT-Display (8-Bit-Parallelbus) an GPIO5-9 und GPIO38-48.</desc>

  <rect x="0" y="0" width="640" height="620" fill="#ffffff"/>

  <text x="320" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2933">Maßarbeit Vision — LilyGO T-Display S3</text>
  <text x="320" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#52606d">ESP32-S3 (Xtensa) · TFT-Anzeige · 2 Taster · siehe include/boards/t_display_s3.h</text>

  <!-- MCU box -->
  <rect x="260" y="160" width="120" height="300" rx="10" fill="#f3f4f6" stroke="#1f2933" stroke-width="2"/>
  <text x="320" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2933">ESP32-S3</text>
  <text x="320" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7b8794">T-Display S3</text>

  <!-- Left side pins -->
  <!-- GPIO1 HX711 DOUT -->
  <line x1="235" y1="172" x2="260" y2="172" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="260" cy="172" r="4" fill="#d97706"/>
  <text x="225" y="168" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#d97706">GPIO 1</text>
  <text x="225" y="182" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">HX711 DOUT</text>

  <!-- GPIO2 HX711 SCK -->
  <line x1="235" y1="241" x2="260" y2="241" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="260" cy="241" r="4" fill="#d97706"/>
  <text x="225" y="237" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#d97706">GPIO 2</text>
  <text x="225" y="251" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">HX711 SCK</text>

  <!-- GPIO0 Taste 1 BOOT -->
  <line x1="235" y1="310" x2="260" y2="310" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="260" cy="310" r="4" fill="#2563eb"/>
  <text x="225" y="306" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#2563eb">GPIO 0</text>
  <text x="225" y="320" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">Taste 1 „BOOT“</text>

  <!-- GPIO14 Taste 2 (wakeup) -->
  <line x1="235" y1="379" x2="260" y2="379" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="260" cy="379" r="7" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="260" cy="379" r="4" fill="#2563eb"/>
  <text x="225" y="375" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#2563eb">GPIO 14</text>
  <text x="225" y="389" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">Taste 2 · weckt aus Deep Sleep</text>

  <!-- GPIO4 Battery ADC -->
  <line x1="235" y1="448" x2="260" y2="448" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="260" cy="448" r="4" fill="#dc2626"/>
  <text x="225" y="444" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#dc2626">GPIO 4</text>
  <text x="225" y="458" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">Batteriespannung (ADC)</text>

  <!-- Right side pins -->
  <!-- GPIO15 Power-Enable -->
  <line x1="380" y1="172" x2="405" y2="172" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="380" cy="172" r="4" fill="#0d9488"/>
  <text x="415" y="168" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0d9488">GPIO 15</text>
  <text x="415" y="182" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">Peripherie-Power-Enable</text>

  <!-- GPIO38 LCD Backlight -->
  <line x1="380" y1="211" x2="405" y2="211" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="380" cy="211" r="4" fill="#7c3aed"/>
  <text x="415" y="207" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#7c3aed">GPIO 38</text>
  <text x="415" y="221" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">LCD Backlight</text>

  <!-- GPIO5 LCD RST -->
  <line x1="380" y1="251" x2="405" y2="251" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="380" cy="251" r="4" fill="#7c3aed"/>
  <text x="415" y="247" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#7c3aed">GPIO 5</text>
  <text x="415" y="261" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">LCD RST</text>

  <!-- GPIO6 LCD CS -->
  <line x1="380" y1="290" x2="405" y2="290" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="380" cy="290" r="4" fill="#7c3aed"/>
  <text x="415" y="286" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#7c3aed">GPIO 6</text>
  <text x="415" y="300" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">LCD CS</text>

  <!-- GPIO7 LCD DC -->
  <line x1="380" y1="329" x2="405" y2="329" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="380" cy="329" r="4" fill="#7c3aed"/>
  <text x="415" y="325" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#7c3aed">GPIO 7</text>
  <text x="415" y="339" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">LCD DC</text>

  <!-- GPIO8 LCD WR -->
  <line x1="380" y1="369" x2="405" y2="369" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="380" cy="369" r="4" fill="#7c3aed"/>
  <text x="415" y="365" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#7c3aed">GPIO 8</text>
  <text x="415" y="379" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">LCD WR</text>

  <!-- GPIO9 LCD RD -->
  <line x1="380" y1="408" x2="405" y2="408" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="380" cy="408" r="4" fill="#7c3aed"/>
  <text x="415" y="404" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#7c3aed">GPIO 9</text>
  <text x="415" y="418" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">LCD RD</text>

  <!-- GPIO39-48 LCD data bus -->
  <line x1="380" y1="448" x2="405" y2="448" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="380" cy="448" r="4" fill="#7c3aed"/>
  <text x="415" y="444" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#7c3aed">GPIO 39–42, 45–48</text>
  <text x="415" y="458" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">LCD-Datenbus D0–D7 (8-Bit-Parallel)</text>

  <!-- Legend -->
  <line x1="20" y1="520" x2="620" y2="520" stroke="#e4e7eb" stroke-width="1"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">
    <circle cx="30" cy="545" r="5" fill="#d97706"/><text x="42" y="549">Wägezelle (HX711)</text>
    <circle cx="180" cy="545" r="5" fill="#2563eb"/><text x="192" y="549">Taster</text>
    <circle cx="270" cy="545" r="5" fill="#0d9488"/><text x="282" y="549">Power-Enable</text>
    <circle cx="390" cy="545" r="5" fill="#7c3aed"/><text x="402" y="549">TFT-Display</text>
    <circle cx="480" cy="545" r="5" fill="#dc2626"/><text x="492" y="549">Batterie</text>
    <circle cx="30" cy="570" r="7" fill="none" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="2,2"/><circle cx="30" cy="570" r="4" fill="#7b8794"/>
    <text x="42" y="574">Taster mit Deep-Sleep-Wakeup</text>
  </g>

  <text x="320" y="605" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#9aa5b1">Quelle: include/boards/t_display_s3.h — GPIO5/6 sind hier LCD RST/CS, daher HX711 auf GPIO1/2 verlegt (abweichend von WeighMyBru2).</text>
</svg>
