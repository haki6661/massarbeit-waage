<svg viewBox="0 0 640 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pinbelegung der Maßarbeit Basis (LilyGO T-OI Plus): GPIO6/7 HX711, GPIO5 Taster mit Deep-Sleep-Wakeup, GPIO3 Status-LED, GPIO2 Batterie-ADC.">
  <title>Pinbelegung Maßarbeit (LilyGO T-OI Plus)</title>
  <desc>GPIO-Zuordnung des ESP32-C3-Boards ohne Display: Wägezelle an GPIO6/7, ein externer Taster an GPIO5 (weckt aus Deep Sleep), Onboard-Status-LED an GPIO3, Batterie-ADC an GPIO2.</desc>

  <rect x="0" y="0" width="640" height="620" fill="#ffffff"/>

  <text x="320" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2933">Maßarbeit — LilyGO T-OI Plus V1.3</text>
  <text x="320" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#52606d">ESP32-C3 (RISC-V) · ohne Display, nur Status-LED · siehe include/boards/t_oi_plus.h</text>

  <!-- MCU box -->
  <rect x="260" y="160" width="120" height="300" rx="10" fill="#f3f4f6" stroke="#1f2933" stroke-width="2"/>
  <text x="320" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2933">ESP32-C3</text>
  <text x="320" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7b8794">T-OI Plus „mini D1 PLUS“</text>

  <!-- Left side pins -->
  <!-- GPIO6 HX711 DOUT -->
  <line x1="235" y1="172" x2="260" y2="172" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="260" cy="172" r="4" fill="#d97706"/>
  <text x="225" y="168" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#d97706">GPIO 6</text>
  <text x="225" y="182" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">HX711 DOUT</text>

  <!-- GPIO7 HX711 SCK -->
  <line x1="235" y1="310" x2="260" y2="310" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="260" cy="310" r="4" fill="#d97706"/>
  <text x="225" y="306" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#d97706">GPIO 7</text>
  <text x="225" y="320" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">HX711 SCK</text>

  <!-- GPIO5 Taster (wakeup) -->
  <line x1="235" y1="448" x2="260" y2="448" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="260" cy="448" r="7" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="260" cy="448" r="4" fill="#2563eb"/>
  <text x="225" y="436" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#2563eb">GPIO 5</text>
  <text x="225" y="450" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">Taster, extern gg. GND</text>
  <text x="225" y="464" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">weckt aus Deep Sleep</text>

  <!-- Right side pins -->
  <!-- GPIO3 Status LED -->
  <line x1="380" y1="172" x2="405" y2="172" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="380" cy="172" r="4" fill="#16a34a"/>
  <text x="415" y="168" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#16a34a">GPIO 3</text>
  <text x="415" y="182" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">Status-LED (onboard, nicht herausgeführt)</text>

  <!-- GPIO2 Battery ADC -->
  <line x1="380" y1="448" x2="405" y2="448" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="380" cy="448" r="4" fill="#dc2626"/>
  <text x="415" y="444" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#dc2626">GPIO 2</text>
  <text x="415" y="458" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">Batteriespannung (ADC1_CH2)</text>

  <!-- Legend -->
  <line x1="20" y1="520" x2="620" y2="520" stroke="#e4e7eb" stroke-width="1"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52606d">
    <circle cx="30" cy="545" r="5" fill="#d97706"/><text x="42" y="549">Wägezelle (HX711)</text>
    <circle cx="180" cy="545" r="5" fill="#2563eb"/><text x="192" y="549">Taster</text>
    <circle cx="270" cy="545" r="5" fill="#16a34a"/><text x="282" y="549">Status-LED</text>
    <circle cx="390" cy="545" r="5" fill="#dc2626"/><text x="402" y="549">Batterie</text>
    <circle cx="30" cy="570" r="7" fill="none" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="2,2"/><circle cx="30" cy="570" r="4" fill="#7b8794"/>
    <text x="42" y="574">Taster mit Deep-Sleep-Wakeup</text>
  </g>

  <text x="320" y="605" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#9aa5b1">Quelle: include/boards/t_oi_plus.h — GPIO5 bewusst gewählt: RTC-fähig, kein Strapping-Pin (anders als GPIO2/8/9).</text>
</svg>
